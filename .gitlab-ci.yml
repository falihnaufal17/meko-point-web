stages:
  - deploy

deploy_to_biznet_gio:
  stage: deploy
  only:
    - main
  before_script:
    - 'which ssh-agent || (apt-get update -y && apt-get install openssh-client -y)'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $BIZ_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Mulai SSH deploy ke Biznet Gio..."
    - |
      ssh $BIZ_USER@$BIZ_HOST <<'EOF'
      set -e
      echo "✅ Masuk ke server"
      cd $BIZ_PATH
      echo "📥 Git pull..."
      sudo git pull origin main
      echo "📦 Install dependency..."
      sudo npm install
      echo "🛠️  Build aplikasi..."
      sudo npm run build
      echo "♻️ Restart pakai PM2..."
      sudo pm2 delete meko-point-web || true
      sudo pm2 start ecosystem.config.js
      sudo pm2 save
      echo "✅ Deploy selesai!"
        EOF
